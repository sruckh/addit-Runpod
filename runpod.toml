# RunPod Serverless Configuration
# This file configures the RunPod serverless deployment

[build]
dockerfile = "Dockerfile"
context = "."

[runtime]
handler = "handler.handler"
gpu = true
gpu_count = 1
memory = 16
cpu = 4

[environment]
HF_HOME = "/app/.cache/huggingface"
PYTHONUNBUFFERED = "1"
# Hugging Face token for accessing gated models (set this in RunPod dashboard)
HF_TOKEN = "${HF_TOKEN}"
# OpenRouter API key for auto-prompt generation (set this in RunPod dashboard)
OPENROUTER_API_KEY = "${OPENROUTER_API_KEY}"

[scaling]
max_concurrency = 1
timeout = 300
idle_timeout = 60